<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!-- Default sans-serif -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>PingFang SC</family>
            <family>SF Pro</family>
        </prefer>
    </alias>


    <!-- Default serif -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>PingFang SC</family>
            <family>SF Pro</family>
        </prefer>
    </alias>


    <!-- Default monospace -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Maple Mono NF CN</family>
            <family>PingFang SC</family>
        </prefer>
    </alias>

    <!-- Default emoji -->
    <alias>
        <family>emoji</family>
        <prefer>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>

</fontconfig>
