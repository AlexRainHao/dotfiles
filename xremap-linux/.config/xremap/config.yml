keymap:
  - name: chrome-style-tab-switch
    # application:
    #   only:
    #     - /google-chrome/
    remap:
      SUPER-SHIFT-LEFTBRACE:
        - CTRL-SHIFT-TAB
      SUPER-SHIFT-RIGHTBRACE:
        - CTRL-TAB

  - name: ctrl-h-to-backspace
    remap:
      CTRL-h: backspace

modmap:
  - name: capslock-to-ctrl
    remap:
      CapsLock: Control_L
